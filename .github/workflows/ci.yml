name: CI/CD Pipeline

on:
  push:
    branches:
      - 'feat/**'
      - main

jobs:
  build-and-test:
    name: Maven Build & JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean package

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [user-service, driver-service, ride-service, location-service, payment-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/01-15-reasons-why-uber/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/01-15-reasons-why-uber/${{ matrix.service }}:${{ github.sha }}
