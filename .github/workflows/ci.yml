name: Mokaf7et el CI

on: [pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot App
        run: mvn clean package -DskipTests

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile first
        run: mvn compile -DskipTests

      - name: Run SpotBugs
        id: spotbugs
        run:  mvn com.github.spotbugs:spotbugs-maven-plugin:check
        continue-on-error: true

      - name: Parse SpotBugs Report
        if: steps.spotbugs.outcome == 'failure'
        id: parse
        run: |
          python3 - <<'PYEOF' > /tmp/spotbugs_report.txt
          import xml.etree.ElementTree as ET
          import glob

          files = glob.glob("**/spotbugsXml.xml", recursive=True)
          lines = []

          for f in files:
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  for bug in root.findall(".//BugInstance"):
                      bug_type  = bug.get("type", "Unknown")
                      src       = bug.find(".//SourceLine")
                      classname = src.get("classname", "Unknown") if src is not None else "Unknown"
                      start     = src.get("start", "?")         if src is not None else "?"
                      end       = src.get("end", "?")           if src is not None else "?"
                      msg       = bug.find("LongMessage")
                      message   = msg.text if msg is not None else "No description"
                      lines.append(f"| `{classname}` | Line {start}–{end} | {bug_type} | {message} |")
              except Exception as e:
                  print(f"Error parsing {f}: {e}")

          if lines:
              print("| Class | Location | Bug Type | Description |")
              print("|---|---|---|---|")
              for l in lines:
                  print(l)
          else:
              print("No bugs found in report.")
          PYEOF
          
          echo "SPOTBUGS_REPORT<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/spotbugs_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR - SpotBugs Failed
        if: steps.spotbugs.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const report = `${{ steps.parse.outputs.SPOTBUGS_REPORT }}`;
            if (report && report.trim()) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Matbawazsh el Denya w7yat a8la 7aga 3ndk 🤦\n\n**SpotBugs found the following issues:**\n\n${report}`
              })
            } else {
              console.log('No SpotBugs report found');
            }

      - name: Fail Job if SpotBugs Failed
        if: steps.spotbugs.outcome == 'failure'
        run: exit 1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker compose build

