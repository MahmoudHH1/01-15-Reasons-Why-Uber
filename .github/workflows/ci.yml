name: Mokaf7et el CI

on: [pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot App
        run: mvn clean package -DskipTests

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        id: checkstyle
        run: mvn checkstyle:check
        continue-on-error: true

      - name: Comment on PR - Checkstyle Failed
        if: steps.checkstyle.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '5attak we7esh emsak el keyboard 3edel 🤦'
            })

      - name: Comment on PR - Checkstyle Fixed
        if: steps.checkstyle.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Enta Tarsh el tarsh and an Uber Hero 🚗💨 — Code style is clean!'
            })

      - name: Fail Job if Checkstyle Failed
        if: steps.checkstyle.outcome == 'failure'
        run: exit 1

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile first
        run: mvn compile -DskipTests

      - name: Run SpotBugs
        id: spotbugs
        run: mvn spotbugs:check
        continue-on-error: true

      - name: Comment on PR - SpotBugs Failed
        if: steps.spotbugs.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Matbawazsh el Denya w7yat a8la 7aga 3ndk 🤦'
            })

      - name: Fail Job if SpotBugs Failed
        if: steps.spotbugs.outcome == 'failure'
        run: exit 1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker compose build

