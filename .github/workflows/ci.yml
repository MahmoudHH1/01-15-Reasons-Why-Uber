name: CI/CD Pipeline

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - main

jobs:
  build-and-test:
    name: Maven Build & JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean package

      - name: Upload service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            user-service/target/*.jar
            driver-service/target/*.jar
            ride-service/target/*.jar
            location-service/target/*.jar
            payment-service/target/*.jar
            api-gateway/target/*.jar
          if-no-files-found: error

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: user-service
            context: .
            dockerfile: user-service/Dockerfile
          - service: driver-service
            context: .
            dockerfile: driver-service/Dockerfile
          - service: ride-service
            context: .
            dockerfile: ride-service/Dockerfile
          - service: location-service
            context: .
            dockerfile: location-service/Dockerfile
          - service: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - service: api-gateway
            context: api-gateway
            dockerfile: api-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Download service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/01-15-reasons-why-uber/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/01-15-reasons-why-uber/${{ matrix.service }}:${{ github.sha }}

  docker-done:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - run: echo "all docker builds complete"
