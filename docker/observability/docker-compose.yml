name: uber-ride-observability

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uberdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uberdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redispass"]
    ports:
      - "6379:6379"

  # Neo4j removed for dashboard demo — ride-service's Neo4jClient is lazy and
  # no dashboard panel queries graph nodes. The neo4j:5 image has an entrypoint
  # race that SIGTERMs itself within ~20ms of startup on Docker Desktop. Re-add
  # later (and pin to neo4j:5.20-community + add NEO4J_server_memory_heap_max__size=512M)
  # if you need recommendation/graph endpoints.

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: uber
      RABBITMQ_DEFAULT_PASS: uberpass
    ports:
      - "5672:5672"
      - "15672:15672"

  ride-service:
    build:
      context: ../..
      dockerfile: ride-service/Dockerfile
    environment:
      SPRING_RABBITMQ_USERNAME: uber
      SPRING_RABBITMQ_PASSWORD: uberpass
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - ride-service

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../k8s/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
