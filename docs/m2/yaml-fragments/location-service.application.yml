# Reference application.yml for location-service (port 8084 host, 8080 container)
# Source: Uber_descriptionM2.pdf §6.5
# Drop into location-service/src/main/resources/application.yml.

server:
  port: 8080

spring:
  application:
    name: location-service

  datasource:
    url: jdbc:postgresql://postgres:5432/uberdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  data:
    redis:
      host: redis
      port: 6379
      password: redispass
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin

  # Location-service only: Cassandra (time-series GPS tracking)
  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: uberks
    schema-action: CREATE_IF_NOT_EXISTS

jwt:
  # Base64-encoded ≥32-byte secret, MUST be identical across all 5 services
  # (user-service issues tokens, every other service verifies independently — §5.1).
  # Hardcoded here intentionally — keep the same value in every service's application.yml.
  secret: "bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u"
  expiration: 86400000
