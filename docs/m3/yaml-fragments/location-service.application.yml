# Reference application.yml for location-service (M3).
# Sources: docs/m3/uber-m3.md §1, §2, §11.

server:
  port: 8080

spring:
  application:
    name: location-service

  # M3: per-service PostgreSQL.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://location-postgres:5432/uberdb-locations}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:redispass}
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin}

  # Location-service only: Cassandra (time-series GPS tracking).
  cassandra:
    contact-points: ${SPRING_CASSANDRA_CONTACT_POINTS:cassandra}
    port: 9042
    local-datacenter: ${SPRING_CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: uberks
    schema-action: CREATE_IF_NOT_EXISTS

  # M3: RabbitMQ — location-service consumes ride.* events to mark ping with rideId.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

# M3: location-service calls driver-service for S4-F3, S4-F9 enrichment — uber-m3.md:2557.
feign:
  driver-service:
    url: ${FEIGN_DRIVER_SERVICE_URL:http://driver-service:8080}

jwt:
  secret: ${JWT_SECRET:bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
