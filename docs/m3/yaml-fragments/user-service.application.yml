# Reference application.yml for user-service (M3, port 8080 inside the pod, exposed via api-gateway).
# Sources: docs/m3/uber-m3.md §1 (datasource), §2 (Feign + RabbitMQ), §11 (actuator).
# Drop into user-service/src/main/resources/application.yml and adjust as needed.

server:
  port: 8080

spring:
  application:
    name: user-service

  # M3: per-service PostgreSQL (uber-m3.md:65–100). No more shared `uberdb`.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://user-postgres:5432/uberdb-users}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  # NoSQL stores (shared instance per uber-m3.md §1.3, logically isolated by collection/keyspace).
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:redispass}
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin}

  # M3: RabbitMQ for async events (uber-m3.md:262–275).
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

# M3: Feign URLs (uber-m3.md:193–205). user-service calls ride-service + payment-service.
feign:
  ride-service:
    url: ${FEIGN_RIDE_SERVICE_URL:http://ride-service:8080}
  payment-service:
    url: ${FEIGN_PAYMENT_SERVICE_URL:http://payment-service:8080}

# JWT contract (carries over from M2 — uber-m3.md:42). Base64-encoded ≥32-byte secret.
# In K8s the secret is injected via env var from the `jwt-secret` Secret (uber-m3.md:1689).
# Defense-in-depth: the gateway is the primary validator (uber-m3.md:2642).
jwt:
  secret: ${JWT_SECRET:bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u}
  expiration: 86400000   # 24h

# M3: actuator + Prometheus scrape config (uber-m3.md:1880–1890).
management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
