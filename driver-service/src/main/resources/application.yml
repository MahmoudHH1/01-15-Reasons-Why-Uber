spring:
  application:
    name: driver-service

  mvc:
    servlet:
      load-on-startup: 1

  datasource:
    url: jdbc:postgresql://postgres:5432/uberdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  data:
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin
    redis:
      host: redis
      port: 6379
      password: redispass

  elasticsearch:
    uris: http://elasticsearch:9200

server:

    rabbitmq:
      host: ${SPRING_RABBITMQ_HOST:rabbitmq}
      port: 5672
      username: ${SPRING_RABBITMQ_USERNAME:guest}
      password: ${SPRING_RABBITMQ_PASSWORD:guest}
      listener:
        simple:
          acknowledge-mode: auto
          default-requeue-rejected: false
          retry:
            enabled: true
            initial-interval: 1000
            max-attempts: 3

  server:
  port: 8080

jwt:
  secret: "bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u"
  expiration: 86400000
feign:
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://user-service:8080}
  location-service:
    url: ${FEIGN_LOCATION_SERVICE_URL:http://location-service:8080}
  ride-service:
    url: ${FEIGN_RIDE_SERVICE_URL:http://ride-service:8080}
