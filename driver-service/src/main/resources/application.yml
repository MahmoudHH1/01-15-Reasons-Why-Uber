spring:
  application:
    name: driver-service

  datasource:
    url: jdbc:postgresql://localhost:5432/uberdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  data:
    mongodb:
      host: localhost
      port: 27017
      database: ubermongo
      username: uberapp
      password: uberpass
    redis:
      host: localhost
      port: 6379
      password: redispass

  elasticsearch:
    uris: http://localhost:9200

server:
  port: 8080

jwt:
  secret: "bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u"
  expiration: 86400000
