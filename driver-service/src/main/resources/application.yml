spring:
  application:
    name: driver-service

  datasource:
    url: jdbc:postgresql://postgres:5432/uberdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: ^^

server:
  port: 8080
