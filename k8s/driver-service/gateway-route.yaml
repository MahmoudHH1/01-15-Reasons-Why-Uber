# Driver-service route entry for the Spring Cloud Gateway.
#
# Coordination artifact — merge this route block into the api-gateway ConfigMap
# owned by S1-INFRA (Seif Tarek Ahmed, 55-3258) in
# k8s/api-gateway/gateway-deployment.yaml or its referenced ConfigMap.
#
# Spec: §13 deliverable #6 — "driver-service gateway route entry"
#
# Route entry (embed into the gateway's spring.cloud.gateway.routes list):
#
#   - id: driver-service
#     uri: http://driver-service.uber.svc.cluster.local:8080
#     predicates:
#       - Path=/api/drivers/**
#     filters:
#       - StripPrefix=0

apiVersion: v1
kind: ConfigMap
metadata:
  name: driver-gateway-route-fragment
  namespace: uber
  annotations:
    spec-ref: "uber-m3.md §13 deliverable #6"
    owner: "55-7978 (Ziad Raafat)"
    coordinate-with: "S1-INFRA 55-3258 (api-gateway K8s)"
data:
  route.yaml: |
    - id: driver-service
      uri: http://driver-service.uber.svc.cluster.local:8080
      predicates:
        - Path=/api/drivers/**
      filters:
        - StripPrefix=0
