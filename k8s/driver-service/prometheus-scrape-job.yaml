# Driver-service scrape job entry for prometheus.yml.
#
# Coordination artifact — merge this job into the 5-job scrape_configs in
# k8s/monitoring/prometheus/prometheus-configmap.yaml owned by S3-INFRA
# (Youssef Mohamed Malek, 55-24816).
#
# Spec: §13 deliverable #6 — "driver-service scrape job entry in prometheus.yml"
#
# Cross-namespace: Prometheus runs in `monitoring` (spec line 2339);
# driver-service runs in `uber` (spec line 2339). Target uses FQDN so
# Prometheus resolves driver-service across namespaces.
#
# Job fragment to merge into prometheus.yml scrape_configs:
#
#   - job_name: 'driver-service'
#     metrics_path: '/actuator/prometheus'
#     scrape_interval: 15s
#     static_configs:
#       - targets: ['driver-service.uber.svc.cluster.local:8080']
#         labels:
#           service: 'driver-service'
#           namespace: 'uber'

apiVersion: v1
kind: ConfigMap
metadata:
  name: driver-prometheus-scrape-fragment
  namespace: monitoring
  annotations:
    spec-ref: "uber-m3.md §13 deliverable #6"
    owner: "55-7978 (Ziad Raafat)"
    coordinate-with: "S3-INFRA 55-24816 (prometheus-configmap.yaml)"
data:
  scrape-job.yaml: |
    - job_name: 'driver-service'
      metrics_path: '/actuator/prometheus'
      scrape_interval: 15s
      static_configs:
        - targets: ['driver-service.uber.svc.cluster.local:8080']
          labels:
            service: 'driver-service'
            namespace: 'uber'
