apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  # Each <svc>-INFRA slice owner adds their dashboard JSON as a key here when their slice lands.
  # Reference: spec §11.5 "Required Files & Directory Structure" + §13.4 Day-0 stub.
  # Owners (per docs/M3_Parallelism_Analysis.xlsx):
  #   user-dashboard.json     — S1-INFRA-final  (Seif Tarek Ahmed,    55-3258)
  #   driver-dashboard.json   — S2-INFRA-final  (Ziad Raafat,         55-7978)
  #   ride-dashboard.json     — S3-INFRA-final  (Youssef Mohamed Malek, 55-24816)
  #   location-dashboard.json — S4-INFRA-final  (Youssef Maged,       55-2829)
  #   payment-dashboard.json  — S5-INFRA-final  (Seif Tarek Mostafa,  55-24853)
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Default'
        orgId: 1
        folder: 'Uber'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /tmp/dashboards
  user-dashboard.json: |
    {
      "title": "User Service Dashboard",
      "uid": "user-service",
      "panels": [
        {
          "title": "Error Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"user-service\", level=\"ERROR\"} [1m]))",
              "legendFormat": "Error rate"
            }
          ]
        },
        {
          "title": "Feign Call Outcomes",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"user-service\"} |= \"Feign call\" [5m]))",
              "legendFormat": "Feign calls"
            }
          ]
        },
        {
          "title": "RabbitMQ Event Audit",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"user-service\"} |= \"routingKey\" [5m]))",
              "legendFormat": "Events"
            }
          ]
        },
        {
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"user-service\"}[5m]))",
              "legendFormat": "Requests/s"
            }
          ]
        },
        {
          "title": "HTTP Latency P99",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"user-service\"}[5m])) by (le, uri))",
              "legendFormat": "P99 {{uri}}"
            }
          ]
        },
        {
          "title": "JVM Heap Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"user-service\", area=\"heap\"}",
              "legendFormat": "Heap used"
            }
          ]
        }
      ]
    }
  driver-dashboard.json: |
    {
      "title": "Driver Service Dashboard (STUB)",
      "panels": []
    }
  ride-dashboard.json: |
    {
      "title": "Ride Service Dashboard (STUB)",
      "panels": []
    }
  location-dashboard.json: |
    {
      "title": "Location Service Dashboard",
      "uid": "location-service",
      "panels": [
        {
          "title": "Error Rate (LogQL)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"location-service\", level=\"ERROR\"} [1m]))",
              "legendFormat": "Errors/min"
            }
          ]
        },
        {
          "title": "Saga Listener Activity (LogQL)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"location-service\"} |= \"location.ride.saga-listener\" [5m]))",
              "legendFormat": "Events processed"
            }
          ]
        },
        {
          "title": "Cassandra Writes (LogQL)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"location-service\"} |= \"TRACKING_RECORDED\" [5m]))",
              "legendFormat": "Cassandra writes"
            }
          ]
        },
        {
          "title": "HTTP Request Rate (PromQL)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"location-service\"}[5m]))",
              "legendFormat": "Requests/s"
            }
          ]
        },
        {
          "title": "HTTP Latency P95 (PromQL)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"location-service\"}[5m])) by (le, uri))",
              "legendFormat": "P95 {{uri}}"
            }
          ]
        },
        {
          "title": "JVM Live Threads (PromQL)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{job=\"location-service\"}",
              "legendFormat": "Threads"
            }
          ]
        }
      ]
    }
  payment-dashboard.json: |
    {
      "title": "Payment Service Dashboard (STUB)",
      "panels": []
    }
