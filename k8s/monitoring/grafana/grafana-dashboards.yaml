apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  # Each <svc>-INFRA slice owner adds their dashboard JSON as a key here when their slice lands.
  # Reference: spec §11.5 "Required Files & Directory Structure" + §13.4 Day-0 stub.
  # Owners (per docs/M3_Parallelism_Analysis.xlsx):
  #   user-dashboard.json     — S1-INFRA-final  (Seif Tarek Ahmed,    55-3258)
  #   driver-dashboard.json   — S2-INFRA-final  (Ziad Raafat,         55-7978)
  #   ride-dashboard.json     — S3-INFRA-final  (Youssef Mohamed Malek, 55-24816)
  #   location-dashboard.json — S4-INFRA-final  (Youssef Maged,       55-2829)
  #   payment-dashboard.json  — S5-INFRA-final  (Seif Tarek Mostafa,  55-24853)
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'uber'
        orgId: 1
        folder: 'Uber'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /tmp/dashboards
  user-dashboard.json: |
    {
      "title": "User Service Dashboard",
      "uid": "user-service",
      "panels": [
        {
          "title": "Error Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"user-service\", level=\"ERROR\"} [1m]))",
              "legendFormat": "Error rate"
            }
          ]
        },
        {
          "title": "Feign Call Outcomes",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"user-service\"} |= \"Feign call\" [5m]))",
              "legendFormat": "Feign calls"
            }
          ]
        },
        {
          "title": "RabbitMQ Event Audit",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"user-service\"} |= \"routingKey\" [5m]))",
              "legendFormat": "Events"
            }
          ]
        },
        {
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"user-service\"}[5m]))",
              "legendFormat": "Requests/s"
            }
          ]
        },
        {
          "title": "HTTP Latency P99",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"user-service\"}[5m])) by (le, uri))",
              "legendFormat": "P99 {{uri}}"
            }
          ]
        },
        {
          "title": "JVM Heap Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"user-service\", area=\"heap\"}",
              "legendFormat": "Heap used"
            }
          ]
        }
      ]
    }
  driver-dashboard.json: |
    {
      "title": "Driver Service Dashboard (STUB)",
      "panels": []
    }
  ride-dashboard.json: |
    {
      "title": "Ride Service Dashboard (STUB)",
      "panels": []
    }
  location-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "count_over_time({app=\"uber\", service=\"location-service\", level=\"ERROR\"} [1m])",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Error Rate Panel (Errors/min)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "{app=\"uber\", service=\"location-service\"} | json | correlationId =~ \".+\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Correlation ID Trace Panel",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "sum by (routingKey) (count_over_time({app=\"uber\", service=\"location-service\"} | json | routingKey =~ \".+\" [1h]))",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "RabbitMQ Event Audit Panel (last hour)",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "uber",
        "location-service"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Location Service Dashboard",
      "uid": "location-service-dashboard",
      "version": 1,
      "weekStart": ""
    }
  payment-dashboard.json: |
    {
      "title": "Payment Service Dashboard (STUB)",
      "panels": []
    }
