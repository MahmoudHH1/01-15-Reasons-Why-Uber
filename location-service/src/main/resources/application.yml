spring:
  application:
    name: location-service

  datasource:
    url: jdbc:postgresql://localhost:5432/uberdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  data:
    cassandra:
      contact-points: localhost
      port: 9042
      local-datacenter: datacenter1
      keyspace-name: uberks
      schema-action: create_if_not_exists
    mongodb:
      uri: mongodb://root:rootpass@localhost:27017/ubermongo?authSource=admin
    redis:
      host: localhost
      port: 6379
      password: redispass

server:
  port: 8080

jwt:
  secret: "bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u"
  expiration: 86400000
