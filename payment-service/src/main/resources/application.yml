spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://payment-postgres:5432/uberdb-payments
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "^^"

  data:
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin
      database: ubermongo
    redis:
      host: redis
      port: 6379
      password: redispass

feign:
  user-service:
    url: http://user-service:8080
  ride-service:
    url: http://ride-service:8080
  driver-service:
    url: http://driver-service:8080

server:
  port: 8080
  error:
    include-message: always

spring.mvc.problemdetails.enabled: true

jwt:
  secret: "bXlzdXBlcnNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9u"
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
